name: Data safety tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Run regression tests
        run: python -m pytest tests -v
      - name: Compile application sources
        run: python -m compileall -q preprocess.py app tests
